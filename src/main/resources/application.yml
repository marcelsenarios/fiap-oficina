spring:
  application:
    name: oficina
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG

security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:minha-chave-secreta-muito-segura-e-longa-para-o-jwt}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
